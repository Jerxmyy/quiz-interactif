<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Quiz Dynamique</title>
    <link rel="stylesheet" href="../assets/css/style.css" />
  </head>
  <body>
    <button id="theme-toggle" type="button" aria-pressed="false">
      Mode sombre
    </button>

    <h1>Quiz Dynamique</h1>

    <div id="intro-screen">
      <p class="notice">
        Testez vos connaissances en quelques questions chronométrées !
      </p>
      <p>Meilleur score : <span id="best-score-value">0</span></p>
      <div id="badges-intro" class="badges-list"></div>
      <button id="start-btn">Commencer le quiz</button>
      <button id="infinite-btn" type="button">Mode infini</button>
    </div>

    <div id="question-screen" style="display: none">
      <div id="progress">
        Question <span id="current-question-index"></span>
        <span id="progress-total"> / <span id="total-questions"></span></span>
      </div>
      <p id="question-text"></p>
      <button id="audio-btn" type="button" class="hidden">Lecture</button>
      <div id="answers"></div>
      <button id="hint-btn" type="button" class="hidden">Indice</button>
      <p id="hint-text" class="hidden" aria-live="polite"></p>
      <div id="timer-div">Temps restant : <span id="time-left">0</span>s</div>
      <button id="next-btn" class="hidden">Question suivante</button>
      <button id="stop-infinite-btn" type="button" class="hidden">
        Arrêter le mode infini
      </button>
    </div>

    <div id="result-screen" style="display: none">
      <h2>Résultat final</h2>
      <p id="score-text"></p>
      <p id="stats-text"></p>
      <p>Meilleur score : <span id="best-score-end">0</span></p>
      <div id="badges-result" class="badges-list"></div>
      <p id="new-badges" class="hidden" aria-live="polite"></p>
      <button id="share-btn">Partager</button>
      <p id="share-link" class="hidden" aria-live="polite"></p>
      <button id="restart-btn">Recommencer</button>
    </div>

    <script type="module" src="../assets/js/quiz.js"></script>
  </body>
</html>
